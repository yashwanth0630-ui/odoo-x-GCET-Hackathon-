version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: stocksense-postgres
    restart: always
    environment:
      POSTGRES_USER: stocksense_admin
      POSTGRES_PASSWORD: stocksense_secure_pass_2026
      POSTGRES_DB: stocksense_ims
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense_admin -d stocksense_ims"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
